yle="font-size:18px;font-weight:700;fill:#f4e2b0">天权</tspan><tspan dx="8" class="sub" style="font-size:13px">收益与代价都上秤</tspan></text><text x="498" y="246" text-anchor="middle"><tspan style="font-size:18px;font-weight:700;fill:#f4e2b0">文曲</tspan><tspan dx="8" class="sub" style="font-size:13px">让意图自己显出来</tspan></text><circle cx="630" cy="284" r="3" fill="#cbd2ee" fill-opacity=".55"/><circle cx="752" cy="292" r="19.2" fill="url(#glowG)"/><circle cx="752" cy="292" r="6" fill="#e3c06f"/><text x="772" y="264" text-anchor="start"><tspan style="font-size:18px;font-weight:700;fill:#f4e2b0">开阳</tspan><tspan dx="8" class="sub" style="font-size:13px">先问真实的数</tspan></text><text x="772" y="286" text-anchor="start"><tspan style="font-size:18px;font-weight:700;fill:#f4e2b0">天梁</tspan><tspan dx="8" class="sub" style="font-size:13px">托付必有回音</tspan></text><circle cx="900" cy="384" r="19.2" fill="url(#glowG)"/><circle cx="900" cy="384" r="6" fill="#e3c06f"/><text x="900" y="414" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#f4e2b0">瑶光</text><text x="900" y="434" text-anchor="middle" class="sub" style="font-size:13px">绿灯不算数，复现即证</text><circle cx="782" cy="236" r="11.2" fill="url(#glowW)"/><circle cx="782" cy="236" r="3.5" fill="#dfe4ff"/><text x="782" y="198" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#e8ebf7">辅</text><text x="782" y="218" text-anchor="middle" class="sub" style="font-size:13px">把经验收成方法</text><circle cx="348" cy="104" r="19.2" fill="url(#glowG)"/><circle cx="348" cy="104" r="6" fill="#e3c06f"/><text x="366" y="102" text-anchor="start" style="font-size:18px;font-weight:700;fill:#f4e2b0">太一</text><text x="366" y="122" text-anchor="start" class="sub" style="font-size:13px">收束好了再起下一手</text><circle cx="150" cy="262" r="16.0" fill="url(#glowW)"/><circle cx="150" cy="262" r="5" fill="#dfe4ff"/><text x="150" y="292" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#e8ebf7">天机</text><text x="150" y="312" text-anchor="middle" class="sub" style="font-size:13px">问一句没人问的话</text><circle cx="584" cy="132" r="16.0" fill="url(#glowW)"/><circle cx="584" cy="132" r="5" fill="#dfe4ff"/><text x="584" y="94" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#e8ebf7">华盖</text><text x="584" y="114" text-anchor="middle" class="sub" style="font-size:13px">不停在看似完成处</text><circle cx="1010" cy="196" r="16.0" fill="url(#glowW)"/><circle cx="1010" cy="196" r="5" fill="#dfe4ff"/><text x="1010" y="158" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#e8ebf7">破军</text><text x="1010" y="178" text-anchor="middle" class="sub" style="font-size:13px">先去撞未知</text><circle cx="1062" cy="300" r="16.0" fill="url(#glowW)"/><circle cx="1062" cy="300" r="5" fill="#dfe4ff"/><text x="1062" y="330" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#e8ebf7">七杀</text><text x="1062" y="350" text-anchor="middle" class="sub" style="font-size:13px">只指出，不亲手砍</text><circle cx="104" cy="470" r="16.0" fill="url(#glowW)"/><circle cx="104" cy="470" r="5" fill="#dfe4ff"/><circle cx="104" cy="470" r="13" fill="none" stroke="#a78bfa" stroke-width="1.5"/><text x="104" y="500" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#e8ebf7">启明</text><text x="104" y="520" text-anchor="middle" class="sub" style="font-size:13px">先照路，不替人走</text><circle cx="1100" cy="470" r="16.0" fill="url(#glowW)"/><circle cx="1100" cy="470" r="5" fill="#dfe4ff"/><text x="1100" y="500" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#e8ebf7">长庚</text><text x="1100" y="520" text-anchor="middle" class="sub" style="font-size:13px">把路留给明天的人</text><text x="104" y="540" text-anchor="middle" style="font-size:12px;fill:#a78bfa">默认</text><text x="600" y="578" text-anchor="middle" class="dim" style="font-size:13px">星位依《星域碑文》：北斗为骨架，天权与文曲同居第四星，开阳与天梁同居第六星，辅星伴开阳，指极线指向太一</text>
</svg>
