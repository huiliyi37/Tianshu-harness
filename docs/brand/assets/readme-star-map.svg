<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">天枢十六星域星图</title>
<desc id="d">依《星域碑文》以北斗七星为骨架排布十六个星域：天枢、天璇、天府、天权（文曲同居）、玉衡、开阳（天梁同居）、瑶光构成北斗，辅星伴随开阳，指极线指向太一；启明与长庚位于地平线两端，天机、华盖、破军、七杀散布四周。每颗星标注了它的工作倾向。</desc>
