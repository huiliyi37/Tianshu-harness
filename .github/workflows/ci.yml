name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # contributors 对账要读 PR 列表（gh pr list）；显式申请只读权限，
    # 不依赖仓库默认 GITHUB_TOKEN 权限档（新仓库默认只有 contents: read）。
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        # package.json engines 要求 Node >=24；低于 24 会在 npm ci 被 engine-strict 拒绝
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Contributors ledger check（仅 push main；PR 不因账本漂移提红）
        # 贡献者名单（CONTRIBUTORS.md）以 GitHub PR 列表为数据源，只增不删。
        # 只在 push main 上判红：外部 PR 本身就是待收编对象，不能让它们一提就红；
        # 漂移在下一次 main 推送时兜住。修复在 dev 主仓跑：
        #   npx tsx scripts/contributors.ts --write（润色新条目描述）→ 随 dev 提交 → sync。
        if: github.event_name == 'push'
        run: npm run contributors:check
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        run: npm run build

  windows-smoke:
    # Real-execution smoke for the Windows command path (Git Bash on the runner).
    # windows-latest ships Git for Windows, so this exercises the actual
    # spawn → stdio pipe → output capture → file side-effect chain that unit
    # tests on Linux cannot reach. Guards the "exit=0, empty stdout" regression.
    # 2026-09-16 起兼作 scripts 层的 Windows 门禁：路径表达式类缺陷（`URL.pathname`
    # 在 Windows 上带前导斜杠，join 后成 `D:\D:\...` → ENOENT）只在 Windows 暴露，
    # 此前没有任何 job 在 Windows 上跑测试文件，只能靠人肉实机跑全量撞。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Windows bash smoke test
        run: node --import tsx --test src/tools/__tests__/bash-windows-smoke.test.ts

      - name: Windows path-expression tests
        # 路径表达式缺陷的 Windows 靶子：`new URL(...).pathname` 在 Windows 上带前导斜杠
        # （`/D:/repo/...`），经 join/readdir/mkdir 成 `D:\D:\...` → ENOENT。scripts 层
        # （swebench-run 的 LOCAL_TMP）与 src 侧（promotion 的 existsSync 判据）各一处。
        run: npx tsx scripts/run-node-tests.ts scripts/ src/context/__tests__/promotion.test.ts

      - name: Windows write_file esbuild fallback
        run: node --import tsx --test src/tools/__tests__/write-file-esbuild-platform.test.ts

      - name: Windows job cleanup and workspace routes
        run: node --import tsx --test src/tools/__tests__/job-store.test.ts src/server/__tests__/multi-root-workspace.test.ts src/server/__tests__/git-pr-workbench.test.ts src/server/__tests__/serve-store-lock.test.ts

  cli-frontend:
    name: CLI frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RIVET_HOME: ${{ github.workspace }}/ceshi/frontend-platform/home
      FRONTEND_BUILD: ${{ github.workspace }}/ceshi/frontend-platform/build
      # Unit fixtures choose their host explicitly; a runner is not a GUI terminal.
      TERM: rivet-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run typecheck
      - name: Frontend tests and native POSIX PTY
        run: >-
          node --import tsx scripts/run-node-tests.ts
          src/tui/ src/cli/ src/__tests__/external-editor
          src/__tests__/platform-conventions src/__tests__/platform-shell
          scripts/__tests__/test-home-isolation
      - name: Build CLI frontend
        run: >-
          node --import tsx --input-type=module -e
          "import { build } from 'tsup'; import config from './tsup.config.ts'; await build({ ...config, config: false, outDir: process.env.FRONTEND_BUILD, clean: false, publicDir: false, onSuccess: undefined });"
      - name: Verify bundled CLI help
        run: >-
          node --input-type=module -e
          "import { execFileSync } from 'node:child_process'; import { join } from 'node:path'; for (const option of ['--help', '--version']) process.stdout.write(execFileSync(process.execPath, [join(process.env.FRONTEND_BUILD, 'cli', 'entry.js'), option], { encoding: 'utf8', windowsHide: true }));"
