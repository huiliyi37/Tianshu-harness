name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines 钉 24.1.0 且 .npmrc engine-strict=true,低于 24 会在 npm ci 直接被拒
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm/cli#4828：lockfile 在 macOS 生成时，npm ci 会跳过平台特定的可选
      # 原生包（@ast-grep/napi-linux-x64-gnu 等），linux 上 ast-grep/ast-edit
      # 全线 "Cannot find native binding"。补装一次并验证可加载。
      - name: Ensure platform-native optional deps (npm/cli#4828)
        run: |
          if ! ls node_modules/@ast-grep/napi-linux* >/dev/null 2>&1; then
            echo "native binding missing after npm ci — reinstalling @ast-grep/napi"
            rm -rf node_modules/@ast-grep
            npm install --no-save @ast-grep/napi
          fi
          node -e "import('@ast-grep/napi').then(() => console.log('napi binding OK'))"

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  windows-smoke:
    # Real-execution smoke for the Windows command path (Git Bash on the runner).
    # windows-latest ships Git for Windows, so this exercises the actual
    # spawn → stdio pipe → output capture → file side-effect chain that unit
    # tests on Linux cannot reach. Guards the "exit=0, empty stdout" regression.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Windows bash smoke test
        run: node --import tsx --test src/tools/__tests__/bash-windows-smoke.test.ts
