name: Bug 报告 · Bug Report
description: 报告一个可复现的问题 · Report a reproducible bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告!安全漏洞请**不要**在这里提交,请走 Security tab → Report a vulnerability。
  - type: dropdown
    id: surface
    attributes:
      label: 使用端 · Surface
      description: 不确定选哪个？看下面两条判据再选，避免误标导致问题被分流到错误的代码路径。
      options:
        - TUI (终端 rivet)
        - 桌面端 Desktop (Tauri)
        - 无界面模式 headless (-p / --json)
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **如何区分 TUI 与桌面端（常见误标点）：**
        - 用鼠标滚轮能滚动聊天区 / 能"贴底跟随、上翻不被拽"→ **桌面端**。raw 模式 TUI 的内容进入终端
          scrollback 后由终端模拟器接管滚动，天枢收不到滚轮事件，也没有桌面端那套滚动跟随状态机。
        - 终端里 Ctrl+C / 键盘翻页 scrollback → **TUI**。
        - 若是 UI 卡顿/抖动类问题，请注明发生时的输出模式与终端模拟器（Windows Terminal / ConHost 等）。
        - 参考：滚动/视图相关问题归集于 #54 / #56 / #58；写工具/委托问题见 #61。
  - type: input
    id: version
    attributes:
      label: 版本 · Version
      description: "`rivet --version` 或桌面端设置页版本号"
      placeholder: "2.15.1"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 平台 · Platform
      placeholder: "macOS 15.4 / Windows 11 / Ubuntu 24.04,Node 24.1.0"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 模型与提供商 · Model & Provider
      placeholder: "deepseek-v4-pro / codex gpt-5.5 / …"
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 · Steps to Reproduce
      description: 从启动到出错的最小步骤
      placeholder: |
        1. rivet
        2. 输入 …
        3. 观察到 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期 vs 实际 · Expected vs Actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 · Logs
      description: |
        会话日志在 `~/.rivet/sessions/<project-slug>/`(Windows 为 `%LOCALAPPDATA%\.rivet`)。
        粘贴前请自行遮蔽 API key 等敏感信息。
      render: text
